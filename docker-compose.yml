services:

  server1:
    image: nginx:alpine
    volumes:
      - ./server1:/usr/share/nginx/html:ro

  server2:
    image: nginx:alpine
    volumes:
      - ./server2:/usr/share/nginx/html:ro

  reverse-proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
